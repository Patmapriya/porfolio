<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f1118"/>
      <stop offset="0.5" stop-color="#161528"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="card-header-grad" x1="260" y1="130" x2="1340" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1c30"/>
      <stop offset="1" stop-color="#172236"/>
    </linearGradient>
    <linearGradient id="ai-avatar-grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#bf94ff"/>
      <stop offset="1" stop-color="#8fe7d3"/>
    </linearGradient>
    <linearGradient id="user-msg-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2a2443"/>
      <stop offset="1" stop-color="#1d2a3a"/>
    </linearGradient>
    <linearGradient id="ai-msg-grad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3b2259"/>
      <stop offset="1" stop-color="#1a3a46"/>
    </linearGradient>
    <linearGradient id="btn-glow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f5d097"/>
      <stop offset="1" stop-color="#dca6ff"/>
    </linearGradient>
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#bg-grad)"/>

  <!-- Glowing Orbs -->
  <circle cx="1300" cy="220" r="300" fill="#bf94ff" fill-opacity="0.12" filter="url(#glow-effect)"/>
  <circle cx="300" cy="800" r="320" fill="#8fe7d3" fill-opacity="0.10" filter="url(#glow-effect)"/>

  <!-- Main Chat Window Card -->
  <rect x="260" y="130" width="1080" height="740" rx="32" fill="#13141c" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Window Header -->
  <path d="M262 162c0-16.6 13.4-30 30-30h1016c16.6 0 30 13.4 30 30v70H262v-70Z" fill="url(#card-header-grad)"/>
  <line x1="262" y1="232" x2="1338" y2="232" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Window Controls -->
  <circle cx="310" cy="181" r="10" fill="#ff5f56"/>
  <circle cx="342" cy="181" r="10" fill="#ffbd2e"/>
  <circle cx="374" cy="181" r="10" fill="#27c93f"/>

  <!-- Header Title & Status -->
  <circle cx="440" cy="181" r="18" fill="url(#ai-avatar-grad)"/>
  <text x="435" y="187" font-family="sans-serif" font-weight="bold" font-size="16" fill="#101318">AI</text>
  <text x="474" y="181" font-family="sans-serif" font-weight="700" font-size="20" fill="#f5f7fb">AI Conversational Assistant</text>
  <circle cx="750" cy="181" r="5" fill="#8fe7d3"/>
  <text x="764" y="186" font-family="sans-serif" font-weight="600" font-size="14" fill="#8fe7d3">Real-time Online</text>

  <!-- Chat Message 1: User -->
  <g transform="translate(680, 270)">
    <rect width="600" height="96" rx="20" fill="url(#user-msg-grad)" stroke="rgba(191, 148, 255, 0.2)" stroke-width="1.5"/>
    <text x="30" y="42" font-family="sans-serif" font-size="17" fill="#e2e8f0" font-weight="500">Can you provide real-time responses with high accuracy?</text>
    <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#8d99ae">User • Just now</text>
  </g>

  <!-- Chat Message 2: AI Response -->
  <g transform="translate(320, 395)">
    <!-- AI Avatar Badge -->
    <circle cx="30" cy="30" r="26" fill="url(#ai-avatar-grad)"/>
    <path d="M22 30h16M30 22v16" stroke="#101318" stroke-width="3" stroke-linecap="round"/>

    <!-- AI Message Bubble -->
    <g transform="translate(72, 0)">
      <rect width="680" height="210" rx="24" fill="url(#ai-msg-grad)" stroke="rgba(143, 231, 211, 0.3)" stroke-width="1.5"/>
      <text x="32" y="45" font-family="sans-serif" font-size="18" font-weight="bold" fill="#8fe7d3">AI Chatbot Response:</text>
      <text x="32" y="85" font-family="sans-serif" font-size="17" fill="#f8fafc" font-weight="400">Yes! I am built with advanced NLP capabilities to deliver</text>
      <text x="32" y="118" font-family="sans-serif" font-size="17" fill="#f8fafc" font-weight="400">instant, intelligent answers in a mobile-responsive interface.</text>

      <!-- Pulse line graphics -->
      <path d="M32 165 h120 l15 -25 l15 50 l15 -35 l15 10 h200" stroke="#8fe7d3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="387" cy="165" r="4" fill="#8fe7d3"/>
    </g>
  </g>

  <!-- Chat Message 3: Quick suggestion chips -->
  <g transform="translate(392, 635)">
    <rect width="180" height="42" rx="21" fill="rgba(191, 148, 255, 0.12)" stroke="rgba(191, 148, 255, 0.3)" stroke-width="1"/>
    <text x="24" y="26" font-family="sans-serif" font-size="14" fill="#dca6ff" font-weight="600">⚡ Instant Answers</text>

    <rect x="196" width="190" height="42" rx="21" fill="rgba(143, 231, 211, 0.12)" stroke="rgba(143, 231, 211, 0.3)" stroke-width="1"/>
    <text x="220" y="26" font-family="sans-serif" font-size="14" fill="#8fe7d3" font-weight="600">📱 Mobile Responsive</text>

    <rect x="402" width="170" height="42" rx="21" fill="rgba(245, 208, 151, 0.12)" stroke="rgba(245, 208, 151, 0.3)" stroke-width="1"/>
    <text x="424" y="26" font-family="sans-serif" font-size="14" fill="#f5d097" font-weight="600">🔒 Secure API</text>
  </g>

  <!-- Input Field Bar -->
  <g transform="translate(320, 720)">
    <rect width="960" height="66" rx="33" fill="#1b1d28" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <text x="36" y="40" font-family="sans-serif" font-size="17" fill="#717a8a">Ask the AI Chatbot anything...</text>
    
    <!-- Send Button -->
    <g transform="translate(896, 9)">
      <rect width="48" height="48" rx="24" fill="url(#btn-glow)"/>
      <path d="M18 24h12M24 18l6 6-6 6" stroke="#101318" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
